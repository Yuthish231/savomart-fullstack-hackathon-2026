services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sitescout-db
    environment:
      POSTGRES_USER: sitescout
      POSTGRES_PASSWORD: sitescout
      POSTGRES_DB: sitescout
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitescout -d sitescout"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
